name: pawspace

# PawSpace - Base de datos distribuida

services:

  # BD distribuida

  spider:
    build:
      context: ./devops/docker
      dockerfile: Dockerfile.mariadb-spider
    image: pawspace-mariadb-spider:11.4
    container_name: pawspace-spider
    hostname: nodo-spider
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - spider_data:/var/lib/mysql
      - ./database/conf/spider.cnf:/etc/mysql/conf.d/zz-nodo.cnf:ro
      # El plugin y los CREATE SERVER se instalan en el arranque: no sobreviven
      # a un volumen de datos nuevo y ha_spider.so no viene en la imagen.
      - ./database/distribuida/nodo-spider/00-plugin-y-servers.sql:/docker-entrypoint-initdb.d/00-plugin-y-servers.sql:ro
    ports:
      - "127.0.0.1:14306:3306"
    networks:
      red_bd:
        ipv4_address: 172.30.0.10
      pawspace-net: {}
    healthcheck: &salud
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  dn_a:
    image: mariadb:11.4
    container_name: pawspace-dn-a
    hostname: nodo-dn-a
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - dn_a_data:/var/lib/mysql
      - ./database/conf/dn_a.cnf:/etc/mysql/conf.d/zz-nodo.cnf:ro
    ports:
      - "127.0.0.1:14307:3306"
    networks:
      red_bd:
        ipv4_address: 172.30.0.11
    healthcheck: *salud

  dn_b:
    image: mariadb:11.4
    container_name: pawspace-dn-b
    hostname: nodo-dn-b
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - dn_b_data:/var/lib/mysql
      - ./database/conf/dn_b.cnf:/etc/mysql/conf.d/zz-nodo.cnf:ro
    ports:
      - "127.0.0.1:14308:3306"
    networks:
      red_bd:
        ipv4_address: 172.30.0.12
    healthcheck: *salud

  rep_a:
    image: mariadb:11.4
    container_name: pawspace-rep-a
    hostname: nodo-rep-a
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - rep_a_data:/var/lib/mysql
      - ./database/conf/rep_a.cnf:/etc/mysql/conf.d/zz-nodo.cnf:ro
    ports:
      - "127.0.0.1:14309:3306"
    networks:
      red_bd:
        ipv4_address: 172.30.0.13
    healthcheck: *salud

  rep_b:
    image: mariadb:11.4
    container_name: pawspace-rep-b
    hostname: nodo-rep-b
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - rep_b_data:/var/lib/mysql
      - ./database/conf/rep_b.cnf:/etc/mysql/conf.d/zz-nodo.cnf:ro
    ports:
      - "127.0.0.1:14310:3306"
    networks:
      red_bd:
        ipv4_address: 172.30.0.14
    healthcheck: *salud

  # Aplicacion

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawspace-backend
    restart: unless-stopped
    environment:
      # La aplicacion no sabe que hay cinco nodos: habla con el spider, que es
      # quien reparte y quien reconstruye las vistas.
      DB_HOST: spider
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pawspace}
      DB_USER: ${DB_USER:-pawuser}
      DB_PASSWORD: ${DB_PASSWORD:-pawpass}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - "8000:8000"
    depends_on:
      spider:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
    networks:
      - pawspace-net

  adminer:
    image: adminer:latest
    container_name: pawspace-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: spider
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      spider:
        condition: service_healthy
    networks:
      - pawspace-net

  # Optional frontend static server (nginx)
  frontend:
    image: nginx:alpine
    container_name: pawspace-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pawspace-net

volumes:
  spider_data:
  dn_a_data:
  dn_b_data:
  rep_a_data:
  rep_b_data:

networks:
  # Red de la aplicacion: backend, adminer, frontend y el spider.
  pawspace-net:
    driver: bridge
  # Red interna de la base de datos. IPs fijas porque las definiciones
  # CREATE SERVER del nodo spider y las replicas apuntan a direcciones.
  red_bd:
    name: pawspace-red-bd
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
