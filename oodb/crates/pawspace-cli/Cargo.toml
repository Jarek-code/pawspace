[package]
name = "pawspace-cli"
description = "CLI de la OODB de PawSpace: adjuntos anclados a las filas de MariaDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pawspace-oodb"
path = "src/main.rs"

[dependencies]
oodb = { workspace = true }
pawspace-modelo = { workspace = true }
pawspace-servicio = { path = "../pawspace-servicio" }
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
