[package]
name = "pawspace-servicio"
description = "Servicio HTTP de la OODB: adjuntos de PawSpace anclados a las filas de MariaDB."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pawspace-oodb-servicio"
path = "src/main.rs"

[dependencies]
oodb = { workspace = true }
pawspace-modelo = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
mysql = { version = "26", default-features = false, features = ["minimal"] }
